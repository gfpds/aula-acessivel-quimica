  <style>
    :root {
      --azul: #1f4e79;
      --azul-claro: #eaf2f8;
      --texto: #1f2937;
      --cinza: #6b7280;
      --borda: #d9e1e8;
      --fundo: #f7f9fb;
      --branco: #ffffff;
      --verde: #2e8b57;
      --laranja: #d96c1a;
      --amarelo: #e3b100;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    .topo {
      background: var(--azul);
      color: white;
      padding: 18px 20px;
    }

    .topo-conteudo {
      max-width: 900px;
      margin: 0 auto;
    }

    .marca {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
    }

    .submarca {
      margin: 4px 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .cartao {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .etiqueta {
      display: inline-block;
      background: var(--azul-claro);
      color: var(--azul);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.15;
    }

    .descricao {
      margin: 0 0 24px;
      color: var(--cinza);
      line-height: 1.5;
    }

    .abas {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .abas button {
      border: 1px solid var(--azul);
      background: white;
      color: var(--azul);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .abas button.ativo {
      background: var(--azul);
      color: white;
    }

    .secao {
      margin-top: 24px;
    }

    .secao h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    ul, ol {
      margin-top: 8px;
      padding-left: 22px;
      line-height: 1.6;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--borda);
      background: #fff;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .acoes {
      display: grid;
      gap: 10px;
      margin-top: 28px;
    }

    .botao {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
    }

    .primario {
      background: var(--azul);
      color: white;
    }

    .secundario {
      border: 1px solid var(--azul);
      color: var(--azul);
      background: white;
    }

    .aviso {
      background: #fff8e1;
      border-left: 4px solid var(--amarelo);
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .erro {
      text-align: center;
      padding: 30px;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.55rem;
      }

      .cartao {
        padding: 18px;
      }
    }

    function solicitarProfessor() {
  if (sessionStorage.getItem("aulaAcessivelProfessor") === "ok") {
    renderizarProfessor();
    return;
  }

  const pin = prompt("Digite o PIN da área do professor:");

  if (pin === null) return;

  if (pin === PROFESSOR_PIN) {
    sessionStorage.setItem("aulaAcessivelProfessor", "ok");
    renderizarProfessor();
  } else {
    alert("PIN incorreto.");
  }
}

function sairModoProfessor() {
  sessionStorage.removeItem("aulaAcessivelProfessor");
  renderizarAluno();
}

async function compartilharAula() {
  const dados = {
    title: `AulaAcessível — ${aula.titulo}`,
    text: `Acesse a ficha da aula: ${aula.titulo}`,
    url: window.location.href
  };

  if (navigator.share) {
    try {
      await navigator.share(dados);
      return;
    } catch (erro) {
      if (erro.name === "AbortError") return;
    }
  }

  try {
    await navigator.clipboard.writeText(window.location.href);
    alert("Link copiado para a área de transferência.");
  } catch (erro) {
    prompt("Copie o link da aula:", window.location.href);
  }
}
